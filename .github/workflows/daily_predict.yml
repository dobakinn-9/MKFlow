# AI 예측 일기장: 하루 2번 예측을 기록하고, 만기가 된 예측을 채점해 저장소에 저장해요.
#  - 한국 07:40 (화~토): 미국 장 마감 직후 → S&P 500 최신 종가로 예측
#  - 한국 16:10 (월~금): 한국 장 마감 직후 → 코스피 당일 종가로 예측
# 같은 시장·같은 거래일은 한 번만 기록돼요. Actions 탭에서 수동 실행도 가능해요.
name: 매일 AI 예측 기록·채점

on:
  schedule:
    - cron: "40 22 * * 1-5"   # UTC 22:40 = 한국 07:40 (다음 날) — 미국 장 마감 후
    - cron: "10 7 * * 1-5"    # UTC 07:10 = 한국 16:10 — 한국 장 마감 후
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: market-flow/requirements.txt

      - name: 패키지 설치
        run: pip install -r market-flow/requirements.txt

      - name: 예측 기록·채점 실행
        working-directory: market-flow
        run: python tracker.py

      - name: 결과를 저장소에 저장
        run: |
          git config user.name "mkflow-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market-flow/data/predictions.csv market-flow/data/outlook_log.csv
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없어요."
          else
            git commit -m "AI 예측 기록·채점 $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
