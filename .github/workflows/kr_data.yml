# 한국 시장 데이터(투자자별 매매·거래대금·PER·VKOSPI·업종·상승하락 종목 수)를 받아 저장소에 저장해요.
# Streamlit 서버(해외)에서 한국거래소 접속이 막혀도 앱이 이 파일을 읽어 보여줄 수 있어요.
name: 한국 시장 데이터 받기

on:
  schedule:
    - cron: "0 7 * * 1-5"     # UTC 07:00 = 한국 16:00 (장 마감 후)
    - cron: "30 0 * * 1-5"    # UTC 00:30 = 한국 09:30 (전날 확정치 보완)
  push:
    paths:
      - market-flow/fetch_kr.py
      - .github/workflows/kr_data.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kr-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: market-flow/requirements.txt

      - name: 패키지 설치
        run: pip install pandas requests

      - name: 한국 데이터 받기
        working-directory: market-flow
        run: python fetch_kr.py

      - name: 저장소에 저장
        if: always()
        run: |
          git config user.name "mkflow-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market-flow/data/kr || true
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없어요."
          else
            git commit -m "한국 시장 데이터 갱신 $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
